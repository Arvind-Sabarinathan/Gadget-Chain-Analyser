<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="${pageTitle} + ' - Gadget Chain Analyzer'">
      Gadget Chain Analyzer
    </title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      rel="stylesheet"
    />
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              dark: {
                100: "#1e293b",
                200: "#1a202c",
                300: "#2d3748",
                400: "#4a5568",
              },
            },
          },
        },
      };
    </script>
    <style>
      html,
      body {
        min-height: 100vh;
        background-color: #1a202c;
      }

      .fade-in {
        animation: fadeIn 0.5s ease-in-out;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body class="bg-gray-900 text-white">
    <!-- Navigation -->
    <nav class="bg-dark-200 border-b border-gray-700">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between h-16">
          <div class="flex items-center">
            <div class="flex-shrink-0 flex items-center">
              <i class="fas fa-shield-alt text-blue-400 text-xl mr-3"></i>
              <span class="font-bold text-xl text-white"
                >Gadget Chain Analyzer</span
              >
            </div>
          </div>
          <div class="flex items-center space-x-4">
            <a
              th:href="@{/}"
              class="px-3 py-2 rounded-md text-sm font-medium text-green-400 hover:bg-dark-300 hover:text-green-300 transition-colors"
            >
              <i class="fas fa-home mr-2"></i>Home
            </a>
            <a
              th:href="@{/upload}"
              class="px-3 py-2 rounded-md text-sm font-medium text-blue-400 hover:bg-dark-300 hover:text-blue-300 transition-colors"
            >
              <i class="fas fa-upload mr-2"></i>Upload
            </a>
            <a
              th:href="@{/artifacts}"
              class="px-3 py-2 rounded-md text-sm font-medium text-pink-400 hover:bg-dark-300 hover:text-pink-300 transition-colors"
            >
              <i class="fas fa-archive mr-2"></i>Artifacts
            </a>
          </div>
        </div>
      </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto py-6 sm:px-6 lg:px-8">
      <div class="px-4 py-6 sm:px-0 fade-in">
        <div th:replace="${content}"></div>
      </div>
    </main>

    <!-- Footer -->
    <footer class="bg-dark-200 border-t border-gray-700 mt-auto">
      <div class="max-w-7xl mx-auto py-4 px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between items-center">
          <p class="text-gray-400 text-sm">
            &copy; 2025 Gadget Chain Aanalyser. All rights reserved.
          </p>
          <div class="text-gray-400 text-sm">
            <i class="fas fa-code-branch mr-2"></i>
            Security Analysis Platform
          </div>
        </div>
      </div>
    </footer>

    <script>
      // Auto-dismiss alerts
      document.addEventListener("DOMContentLoaded", function () {
        setTimeout(() => {
          const alerts = document.querySelectorAll(".alert-auto-dismiss");
          alerts.forEach((alert) => {
            alert.style.transition = "opacity 0.5s ease";
            alert.style.opacity = "0";
            setTimeout(() => alert.remove(), 500);
          });
        }, 5000);
      });
    </script>
  </body>
</html>
